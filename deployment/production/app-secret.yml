apiVersion: v1
kind: Secret
metadata:
  name: xpilot-bot-secret
  namespace: xpilot-production
type: Opaque
stringData:
  MICROSOFT_APP_ID: "your-production-app-id-here"
  MICROSOFT_APP_PASSWORD: "your-production-client-secret-here"
  MICROSOFT_APP_TENANT_ID: "your-tenant-id-here"
  LANGFLOW_URL: "https://langflow.yourdomain.com"
  LANGFLOW_API_KEY: "your-production-api-key-here"
  LANGFLOW_CHAT_FLOW_ID: "your-production-chat-flow-id"
  LANGFLOW_REQUIREMENT_FLOW_ID: "your-production-requirement-flow-id"
  PORT: "3978"
